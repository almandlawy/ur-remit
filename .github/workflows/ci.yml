name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  backend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test scripts/analytics-contract.test.ts
      - run: python3 scripts/check-protected-rates.py
      - run: pnpm --filter @ur/backend lint
      - run: pnpm --filter @ur/backend test
      - run: pnpm --filter @ur/admin lint
      - run: pnpm --filter @ur/admin build
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml --project ios
      - run: xcodebuild -project ios/URRemit.xcodeproj -scheme URRemit -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -project ios/URRemit.xcodeproj -scheme URRemit -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath artifacts/URGlobal-tests.xcresult test
      - name: Create archive without signing or uploading
        run: xcodebuild -project ios/URRemit.xcodeproj -scheme URRemit -destination 'generic/platform=iOS' -archivePath artifacts/URGlobal-1.1-build12.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: URGlobal-1.1-build12-validation
          path: artifacts/
          retention-days: 14
