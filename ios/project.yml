name: URRemit
options:
  bundleIdPrefix: com.urremit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
targets:
  URRemit:
    type: application
    platform: iOS
    sources:
      - path: UR
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - URRemitTests
  URRemitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: URRemit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile.tests
