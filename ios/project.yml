name: URRemit
options:
  bundleIdPrefix: com.urremit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 20
    MARKETING_VERSION: 1.2.1
    DEVELOPMENT_TEAM: H7LT4CJA73
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  URRemit:
    type: application
    platform: iOS
    sources:
      - path: UR
        excludes:
          - Features/WelcomeView.swift
          - App/RootView.swift.before-native.bak
          - Features/More/MoreView.swift.before-native.bak
      - path: Resources
        excludes:
          - Info.plist
          - URRemit.entitlements
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/URRemit.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: URWidget
        embed: true
      - target: URLiveActivity
        embed: true
    scheme:
      testTargets:
        - URRemitTests
  URRemitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: URRemit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile.tests
        GENERATE_INFOPLIST_FILE: true
  URWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/URWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile.widget
        INFOPLIST_FILE: Extensions/URWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/URWidget/URWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
  URLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/URLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile.liveactivity
        INFOPLIST_FILE: Extensions/URLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
  URWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/URWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urremit.mobile.watchapp
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
